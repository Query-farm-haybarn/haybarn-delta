#
# Haybarn build-fork: calls the HAYBARN-FORK distribution pipeline (not upstream
# duckdb/extension-ci-tools) so the build picks up Haybarn's R2-backed ccache,
# pre-built GHCR images, and 4.13.6 toolchain. duckdb_version is the Haybarn
# engine tag (v1.5.2); v1.5.1 is not pushed to the Haybarn fork.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@dc0cae2971be09896f7d66dd57c7481e074ce5e2
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    with:
      # Main config
      extension_name: &ext_name delta
      duckdb_version: &duckdb_ref v1.5.2
      ci_tools_version: &ci_tools_ref dc0cae2971be09896f7d66dd57c7481e074ce5e2
      enable_rust: true
      rust_logs: true
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl'

      # Config to write vcpkg binary cache
      extra_toolchains: ${{ github.event_name != 'pull_request' && ';downgraded_aws_cli;python3;' || 'python3' }}
      save_cache: ${{ github.event_name != 'pull_request' }}
      vcpkg_binary_sources: ${{ github.event_name != 'pull_request' && vars.VCPKG_BINARY_SOURCES || '' }}
      reduced_ci_mode: ${{ github.event_name == 'pull_request' && 'enabled' || 'disabled'}}

      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'


  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_deploy.yml@dc0cae2971be09896f7d66dd57c7481e074ce5e2
    secrets: inherit
    with:
      extension_name: *ext_name
      duckdb_version: *duckdb_ref
      ci_tools_version: *ci_tools_ref
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl'
      # deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/haybarn' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/haybarn' }}
      reduced_ci_mode: ${{ github.event_name == 'pull_request' && 'enabled' || 'disabled'}}

  code-quality-check:
    name: Code Quality Check
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_code_quality.yml@dc0cae2971be09896f7d66dd57c7481e074ce5e2
    with:
      extension_name: *ext_name
      duckdb_version: *duckdb_ref
      ci_tools_version: *ci_tools_ref
      format_checks: format
      extra_toolchains: 'python3'
